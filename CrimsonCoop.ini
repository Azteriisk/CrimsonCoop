; ==============================================================================
; Crimson Desert 3-Player Co-Op Mod Configuration (CrimsonCoop)
; Supported Playable Mercenaries: Kliff, Damiane, Oongka
; ==============================================================================

[General]
; Character to request when joining a co-op session (Kliff, Damiane, Oongka)
PreferredCharacter = Damiane

; Automatically select the first available character if your preferred role is taken
AutoSelectAvailable = true

[Network]
; State replication tick rate in Hz (20, 30, or 60)
TickRate = 30

; Client-side interpolation smoothing delay in milliseconds
InterpolationDelayMs = 50

; Route P2P traffic through the Valve Relay Network (SDR) for privacy and NAT traversal
UseSteamRelay = true

[UI]
; Virtual-Key code to toggle the in-game overlay (0x71 = VK_F2, 0x2D = VK_INSERT)
ToggleKey = 0x71

; Display the on-screen Greymane party HUD
ShowPartyHUD = true

; HUD background opacity (0.1 to 1.0)
HudOpacity = 0.85

[Advanced]
; Spawn a Win32 developer console window on startup to view real-time diagnostics
DebugConsole = false

; Memory search radius (bytes) for BlackSpace Engine AOB self-healing
SelfHealWindow = 0x200
